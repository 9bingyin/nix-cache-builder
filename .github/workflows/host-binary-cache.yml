name: Host Binary Cache

on:
  repository_dispatch:
    types:
      - flake-updated
  workflow_dispatch:
    inputs:
      repository:
        description: "配置 GitHub 仓库（owner/repo）"
        required: true
        type: string
      ref:
        description: "分支、标签或提交；留空使用变量 FLAKE_REF，未设置则使用默认分支"
        required: false
        type: string
      hosts:
        description: "逗号分隔的主机名或 root.host；留空构建全部配置顶层"
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: host-binary-cache-${{ github.ref }}
  cancel-in-progress: false

env:
  FLAKE_REPOSITORY: ${{ inputs.repository || vars.FLAKE_REPOSITORY }}
  FLAKE_REF: ${{ inputs.ref || vars.FLAKE_REF }}
  FLAKE_PATH: flake-config
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    accept-flake-config = true
  NIXPKGS_ALLOW_UNFREE: "1"
  CACHE_URLS: https://cache.bingyin.org
  CACHE_TRUSTED_PUBLIC_KEYS: cache.bingyin.org-1:PU5qCuJfhYPKSIRdOMCndVB6Dn9rRRIRVZAnG2uAPSI=
  NIKS3_SERVER: https://niks3.bingyin.org

jobs:
  discover-hosts:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Validate configuration repository
        run: |
          if [[ ! "$FLAKE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::请填写 repository（owner/repo）；自动触发需设置仓库变量 FLAKE_REPOSITORY。"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.FLAKE_REPOSITORY }}
          ref: ${{ env.FLAKE_REF }}
          token: ${{ secrets.FLAKE_REPO_TOKEN }}
          persist-credentials: false
          path: ${{ env.FLAKE_PATH }}

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.FLAKE_REPO_TOKEN }}
          extra_nix_config: |
            extra-substituters = ${{ env.CACHE_URLS }} https://cache.numtide.com?priority=41
            extra-trusted-public-keys = ${{ env.CACHE_TRUSTED_PUBLIC_KEYS }} niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - id: discover
        name: Discover configuration names and target runners
        env:
          HOSTS: ${{ inputs.hosts }}
          HOST_SYSTEM_OVERRIDES: ${{ vars.HOST_SYSTEM_OVERRIDES }}
          HOST_RUNNER_OVERRIDES: ${{ vars.HOST_RUNNER_OVERRIDES }}
          AARCH64_DARWIN_RUNNER: ${{ vars.AARCH64_DARWIN_RUNNER }}
          X86_64_DARWIN_RUNNER: ${{ vars.X86_64_DARWIN_RUNNER }}
          X86_64_LINUX_RUNNER: ${{ vars.X86_64_LINUX_RUNNER }}
          AARCH64_LINUX_RUNNER: ${{ vars.AARCH64_LINUX_RUNNER }}
        run: ./scripts/ci.sh discover

  build-hosts:
    needs: discover-hosts
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover-hosts.outputs.matrix) }}
    name: Build ${{ matrix.root }}.${{ matrix.host }} (${{ matrix.expectedSystem }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.FLAKE_REPOSITORY }}
          token: ${{ secrets.FLAKE_REPO_TOKEN }}
          persist-credentials: false
          path: ${{ env.FLAKE_PATH }}
          ref: ${{ matrix.flakeRev }}

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.FLAKE_REPO_TOKEN }}
          extra_nix_config: |
            extra-substituters = ${{ env.CACHE_URLS }} https://cache.numtide.com?priority=41
            extra-trusted-public-keys = ${{ env.CACHE_TRUSTED_PUBLIC_KEYS }} niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Configure automatic cache uploads
        uses: Mic92/niks3-action@v1
        with:
          server-url: ${{ env.NIKS3_SERVER }}
          substituter: ${{ env.CACHE_URLS }}
          drain-timeout: "3600"

      - id: host
        name: Evaluate native derivation and read cache settings
        env:
          HOST_JSON: ${{ toJSON(matrix) }}
        run: ./scripts/ci.sh prepare

      - name: Build verified derivation and queue toplevel closure
        env:
          DRV_PATH: ${{ steps.host.outputs.drvPath }}
          EXTRA_SUBSTITUTERS: ${{ env.CACHE_URLS }} ${{ steps.host.outputs.extraSubstituters }}
          EXTRA_TRUSTED_PUBLIC_KEYS: ${{ env.CACHE_TRUSTED_PUBLIC_KEYS }} ${{ steps.host.outputs.extraTrustedPublicKeys }}
        run: ./scripts/ci.sh build
